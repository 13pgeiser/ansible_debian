---

- name: Rebuild locales database
  ansible.builtin.command: "{{ item }}"
  with_items:
    - dpkg-reconfigure locales -f noninteractive
    - /usr/sbin/locale-gen
  become: true
  changed_when: true

- name: Restart SSH
  ansible.builtin.service:
    name: sshd
    state: restarted
  become: true
  changed_when: true
