---

- name: Print informations
  ansible.builtin.debug:
    msg:
      - "ansible_host                       = {{ ansible_host }}"
      - "ansible_architecture               = {{ ansible_facts.architecture }}"
      - "ansible_os_family                  = {{ ansible_facts.os_family }}"
      - "ansible_processor                  = {{ ansible_facts.processor[1] }} \
        {{ ansible_facts.processor[2] }}  threads -> {{ ansible_facts.processor | count / 3 }}"
      - "ansible_bios_version               = {{ ansible_facts.bios_version }}"
      - "ansible_bios_date                  = {{ ansible_facts.bios_date }}"
      - "ansible_date_time                  = {{ ansible_facts.date_time.iso8601_micro }}"
      - "ansible_distribution               = {{ ansible_facts.distribution }}"
      - "ansible_distribution_release       = {{ ansible_facts.distribution_release }}"
      - "ansible_distribution_major_version = {{ ansible_facts.distribution_major_version }}"
      - "ansible_lsb.id                     = {{ ansible_facts.lsb.id if 'id' in ansible_facts.lsb else 'undefined' }}"
      - "ansible_lsb.description            = {{ ansible_facts.lsb.description if 'description' in ansible_facts.lsb else 'undefined' }}"
      - "ansible_lsb.release                = {{ ansible_facts.lsb.release if 'release' in ansible_facts.lsb else 'undefined' }}"
      - "ansible_lsb.codename               = {{ ansible_facts.lsb.codename if 'codename' in ansible_facts.lsb else 'undefined' }}"
      - "ansible_machine                    = {{ ansible_facts.machine }}"
      - "ansible_kernel                     = {{ ansible_facts.kernel }}"
      - "ansible_memtotal_mb                = {{ ansible_facts.memtotal_mb }}"
      - "ansible_memfree_mb                 = {{ ansible_facts.memfree_mb }}"

- name: Check if we run precisely debian
  ansible.builtin.fail:
    msg: "Unsupported distribution"
  when: ansible_facts.distribution != 'Debian'

- name: Set apt cache if configured
  ansible.builtin.template:
    src: proxy.j2
    dest: /etc/apt/apt.conf.d/proxy
    owner: root
    group: root
    mode: "0644"
  when: apt_cache is defined

- name: Install python3-debian (required by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    install_recommends: false

- name: Add repositories for main contrib non-free non-free-firmware
  ansible.builtin.deb822_repository:
    name: debian
    types: [deb]
    uris: [http://http.debian.net/debian]
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [main, contrib, non-free, non-free-firmware]
    state: present

- name: Add repositories for updates main non-free non-free-firmware
  ansible.builtin.deb822_repository:
    name: debian-updates
    types: [deb]
    uris: [http://http.debian.net/debian]
    suites: ["{{ ansible_facts.distribution_release }}-updates"]
    components: [main, non-free, non-free-firmware]
    state: present

- name: Add repository for debian security.
  ansible.builtin.deb822_repository:
    name: debian-security
    types: [deb]
    uris: [http://http.debian.net/debian-security]
    suites: ["{{ ansible_facts.distribution_release }}-security"]
    components: [main]
    state: present

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: true
    install_recommends: false
  vars:
    pkgs:
      - python3-psutil
      - cryptsetup
      - pv
      - vim
      - laptop-mode-tools
      - hdparm
      - sdparm
      - acpid
      - mc
      - rsync
      - systemd-timesyncd
      - acl

- name: Install fastfetch
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: true
    install_recommends: false
  vars:
    pkgs:
      - fastfetch

- name: Fastfetch
  ansible.builtin.command: "fastfetch"
  register: fastfetch
  changed_when: false

- name: Print fastfetch information
  ansible.builtin.debug:
    msg: "{{ fastfetch.stdout.split('\n') }}"
    verbosity: 2

- name: Install non-free firmwares
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: true
    install_recommends: false
  vars:
    pkgs:
      - firmware-linux-nonfree
      - firmware-misc-nonfree
      - firmware-linux-free
      - firmware-linux
      - firmware-atheros
      - firmware-brcm80211
      - firmware-intel-sound
      - firmware-iwlwifi
      - firmware-libertas
      - firmware-ralink
      - firmware-realtek

- name: Install firmware-mediatek
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: true
    install_recommends: false
  vars:
    pkgs:
      - firmware-mediatek

- name: Update all packages to the latest version
  ansible.builtin.apt:
    upgrade: dist

- name: Force Swiss keyboard settings
  ansible.builtin.lineinfile:
    regexp: "^{{ item | regex_replace('=.*', '=') }}"
    line: "{{ item }}"
    dest: /etc/default/keyboard
  with_items:
    - XKBLAYOUT="ch"
    - XKBVARIANT="fr"
    - XKBOPTIONS="terminate:ctrl_alt_bks"

- name: Select default locale (English International)
  ansible.builtin.debconf:
    name: locales
    question: locales/default_environment_locale
    value: en_IN
    vtype: select
  notify:
    - Rebuild locales database

- name: /etc/locale.gen
  ansible.builtin.lineinfile:
    dest: /etc/locale.gen
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: "{{ item.state }}"
  with_items:
    - { regexp: '^#? ?en_IN UTF-8', line: 'en_IN UTF-8', state: present }
    - { regexp: '^#? ?en_US.UTF-8 UTF-8', line: 'en_US.UTF-8 UTF-8', state: present }
  notify:
    - Rebuild locales database

- name: Remove brltty (causes troubles with USB-Uart cables)
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: absent
  vars:
    pkgs:
      - brltty

- name: Ensure StreamLocalBindUnlink is enabled in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '(?i)^#?\s*StreamLocalBindUnlink'
    line: 'StreamLocalBindUnlink yes'
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH
