---

- name: Install linux headers
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: true
    install_recommends: false
  vars:
    pkgs:
    - linux-headers-amd64

- name: Accept license
  ansible.builtin.debconf:
    name: zfs-dkms
    question: zfs-dkms/note-incompatible-licenses
    value: true
    vtype: boolean

- name: Install zfs-dkms
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: false
    install_recommends: false
  vars:
    pkgs:
    - zfs-dkms

- name: Load zfs module
  community.general.modprobe:
    name: zfs
    state: present

- name: Install zfsutils-linux
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: false
    install_recommends: false
  vars:
    pkgs:
    - zfsutils-linux

- name: Install zfsnap packages
  ansible.builtin.apt:
    name: "{{ pkgs }}"
    state: present
    update_cache: false
    install_recommends: false
  vars:
    pkgs:
    - zfsnap
